<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="Counting down to the project deadline: December 20, 2026, at 8:00 AM in Austria."
    />
    <title>Project deadline — December 20</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0d1117;
        --foreground: #f0f6fc;
        --muted: #919ba7;
        --border: rgba(240, 246, 252, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* A faint grid and soft light keep the GitHub-dark background subtle. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(240, 246, 252, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(240, 246, 252, 0.025) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse at center, black, transparent 75%);
      }

      main {
        position: relative;
        display: grid;
        place-items: center;
        padding: 64px 24px;
        background: radial-gradient(
          ellipse at center,
          rgba(240, 246, 252, 0.035),
          transparent 65%
        );
      }

      .deadline {
        width: min(100%, 1080px);
        text-align: center;
      }

      .github-icon {
        display: block;
        width: 48px;
        height: 48px;
        margin: 0 auto 28px;
        color: var(--foreground);
      }

      .date {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 44px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: #c9d1d9;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .date-divider {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted);
      }

      .countdown {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
        align-items: start;
        width: 100%;
      }

      .unit {
        min-width: 0;
      }

      .number,
      .separator {
        display: block;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(54px, 11.8vw, 144px);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.075em;
        line-height: 1.15;
      }

      .number {
        padding-right: 0.075em;
        text-shadow: 0 0 48px rgba(240, 246, 252, 0.06);
      }

      .separator {
        padding: 0 0.025em;
        color: #4d5662;
        transform: translateY(-0.035em);
      }

      .unit-label {
        display: block;
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.24em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .rule {
        width: 48px;
        height: 1px;
        margin: 46px auto 28px;
        background: #444c56;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4.2vw, 48px);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.2;
      }

      .status {
        min-height: 20px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.03em;
        line-height: 1.6;
      }

      .info-button {
        position: fixed;
        right: calc(24px + env(safe-area-inset-right, 0px));
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        z-index: 1;
        display: grid;
        place-items: center;
        width: 128px;
        height: 128px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--background);
        color: var(--muted);
        text-decoration: none;
      }

      .info-button:hover {
        border-color: var(--muted);
        color: var(--foreground);
      }

      .info-button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 4px;
        color: var(--foreground);
      }

      .info-button::after {
        content: "";
        position: absolute;
        inset: -13px;
        border: 2px solid var(--foreground);
        border-radius: 48% 52% 49% 51% / 52% 47% 53% 48%;
        transform: rotate(-10deg);
        pointer-events: none;
      }

      .info-hint {
        position: absolute;
        right: calc(100% + 50px);
        bottom: 90px;
        color: #ff4b4b;
        font-family: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif;
        font-size: clamp(64px, 6vw, 88px);
        font-style: normal;
        font-weight: 900;
        letter-spacing: 0.025em;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 3px 4px 0 #8c1a25;
        white-space: nowrap;
        transform: rotate(-12deg) skewX(-6deg);
        transform-origin: right center;
        pointer-events: none;
      }

      .info-hint-line {
        position: absolute;
        right: calc(100% + 10px);
        bottom: 76px;
        width: 52px;
        height: 44px;
        color: var(--foreground);
        pointer-events: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 540px) {
        main {
          padding: 48px 16px;
        }

        .date {
          gap: 9px;
          margin-bottom: 36px;
          padding: 9px 13px;
          font-size: 9px;
          letter-spacing: 0.09em;
        }

        .number,
        .separator {
          font-size: clamp(36px, 11.8vw, 64px);
        }

        .unit-label {
          margin-top: 10px;
          font-size: 8px;
          letter-spacing: 0.12em;
        }

        .rule {
          margin-top: 36px;
          margin-bottom: 24px;
        }

        .info-hint {
          right: 0;
          bottom: calc(100% + 52px);
          font-size: clamp(48px, 12vw, 64px);
        }

        .info-hint-line {
          right: 38px;
          bottom: calc(100% + 8px);
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="deadline" aria-labelledby="heading">
        <svg
          class="github-icon"
          width="48"
          height="48"
          viewBox="0 0 16 16"
          fill="currentColor"
          role="img"
          aria-label="GitHub"
          focusable="false"
        >
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
        </svg>
        <p class="date">
          <time datetime="2026-12-20T08:00:00+01:00">20 December 2026</time>
          <span class="date-divider" aria-hidden="true"></span>
          <span>08:00 AM CET</span>
        </p>

        <div class="countdown" role="timer" aria-label="Time remaining until the project deadline">
          <div class="unit">
            <span class="number" id="days">--</span>
            <span class="unit-label">Days</span>
          </div>
          <span class="separator" aria-hidden="true">:</span>
          <div class="unit">
            <span class="number" id="hours">--</span>
            <span class="unit-label">Hours</span>
          </div>
          <span class="separator" aria-hidden="true">:</span>
          <div class="unit">
            <span class="number" id="minutes">--</span>
            <span class="unit-label">Minutes</span>
          </div>
          <span class="separator" aria-hidden="true">:</span>
          <div class="unit">
            <span class="number" id="seconds">--</span>
            <span class="unit-label">Seconds</span>
          </div>
        </div>

        <div class="rule" aria-hidden="true"></div>
        <h1 id="heading">project deadline</h1>
        <p class="status" id="status" role="status">The clock is ticking.</p>
        <noscript>
          <p class="status">Enable JavaScript to see the live countdown.</p>
        </noscript>
      </section>
    </main>

    <a class="info-button" href="about.html" aria-label="About this project" title="About this project">
      <span class="info-hint" aria-hidden="true">click me</span>
      <svg class="info-hint-line" width="52" height="44" viewBox="0 0 52 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M14 12C29 10 39 18 50 34" />
      </svg>
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="7" r="1" fill="currentColor" stroke="none" />
        <path d="M11 11h1v6m-2 0h4" />
      </svg>
    </a>

    <script>
      // Austria uses CET (UTC+01:00) in December.
      // This explicit offset keeps the deadline the same for every visitor.
      // Change this value and the date above to use a different deadline.
      const DEADLINE = new Date("2026-12-20T08:00:00+01:00").getTime();

      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
      };
      const statusMessage = document.getElementById("status");

      function updateCountdown() {
        const remaining = Math.max(0, Math.ceil((DEADLINE - Date.now()) / 1000));
        const values = {
          days: Math.floor(remaining / 86400),
          hours: Math.floor((remaining % 86400) / 3600),
          minutes: Math.floor((remaining % 3600) / 60),
          seconds: remaining % 60,
        };

        for (const [unit, value] of Object.entries(values)) {
          const formatted = String(value).padStart(2, "0");
          if (fields[unit].textContent !== formatted) {
            fields[unit].textContent = formatted;
          }
        }

        if (remaining === 0) {
          statusMessage.textContent = "The deadline has arrived.";
          return;
        }

        // Recalculate from the actual time so background tabs cannot cause drift.
        window.setTimeout(updateCountdown, 1000 - (Date.now() % 1000));
      }

      updateCountdown();
    </script>
  </body>
</html>
